name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m365risk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d m365risk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TOKEN_ENCRYPTION_KEY: ci-master-key-with-at-least-32-characters
      MOCK_ADMIN_SECRET: unit-test-mock-admin-secret
      METRICS_KEY: ci-metrics-secret-with-sufficient-length
      DATABASE_URL: postgresql+asyncpg://m365risk:m365risk@localhost:5432/m365risk
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/m365risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install uv
      - run: uv pip sync --system requirements-dev.txt
      - run: ruff check services packages tests scripts
      - run: mypy services packages
      - run: pytest -m "not integration and not e2e" --cov=services --cov=packages --cov-report=xml
      - run: psql "$DATABASE_ADMIN_URL" -f db/init/001_roles.sql
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m services.api.app.seed
      - run: pytest -m integration
      - run: python -m scripts.export_openapi
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 10.28.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml}
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install uv && uv pip sync --system requirements.txt
      - env: {TOKEN_ENCRYPTION_KEY: ci-openapi-master-key-with-at-least-32-characters}
        run: python -m scripts.export_openapi
      - run: pnpm --dir apps/web generate:api
      - run: git diff --exit-code -- openapi.json apps/web/src/lib/generated-api.ts

  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install uv && uv pip sync --system requirements-dev.txt
      - run: python scripts/generate_synthetic.py --tenants 2 --users-per-tenant 10 --days 30 --campaigns 2
      - run: python scripts/create_notebooks.py
      - run: mkdir -p reports/generated
      - run: python -m papermill notebooks/03_user_risk_hybrid.ipynb reports/generated/03.ipynb -p PROJECT_ROOT "$PWD"
      - uses: actions/upload-artifact@v4
        with: {name: notebook-smoke, path: reports/generated}

  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install uv && uv pip sync --system requirements.txt
      - run: cp .env.example .env && python -m scripts.build_demo_model
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: ./scripts/wait-for-demo.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 10.28.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml}
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: CI=1 pnpm --dir apps/web test:e2e
      - if: always()
        run: |
          docker compose logs --no-color > compose.log || true
          docker compose down -v
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: compose-logs, path: compose.log}

  security-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 10.28.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm --dir apps/web install --frozen-lockfile && pnpm --dir apps/web audit --audit-level high
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.python --output type=oci,dest=/tmp/python.oci .
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f apps/web/Dockerfile --output type=oci,dest=/tmp/web.oci apps/web
      - id: trivy-python
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {input: /tmp/python.oci, format: sarif, output: trivy-python.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - id: trivy-web
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {input: /tmp/web.oci, format: sarif, output: trivy-web.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - uses: anchore/sbom-action@v0.20.5
        with: {file: /tmp/python.oci, output-file: python.spdx.json, format: spdx-json}
      - uses: anchore/sbom-action@v0.20.5
        with: {file: /tmp/web.oci, output-file: web.spdx.json, format: spdx-json}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            *.json
            *.sarif
      - name: Enforce image vulnerability gate
        if: always()
        env:
          PYTHON_SCAN: ${{ steps.trivy-python.outcome }}
          WEB_SCAN: ${{ steps.trivy-web.outcome }}
        run: |
          test "$PYTHON_SCAN" = success
          test "$WEB_SCAN" = success
