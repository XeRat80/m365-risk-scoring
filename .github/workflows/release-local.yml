name: Local release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci-gates:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          }
          mkdir -p artifacts/models/current
          gh release download "model-$version" -p "approved-model-$version.tar.gz" -p "approved-model-$version.sha256"
          sha256sum -c "approved-model-$version.sha256"
          tar -C artifacts/models/current -xzf "approved-model-$version.tar.gz"
          test "$(python -c 'import json; print(json.load(open("artifacts/models/current/manifest.json"))["version"])')" = "$version"
      - run: python -m scripts.check_model_gate artifacts/models/current/manifest.json --require-approved
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: mkdir -p release/images
      - name: Build loadable architecture-specific OCI images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -t "m365-risk-python:$version" -f Dockerfile.python --output "type=docker,dest=release/images/python-$arch.tar" .
            docker buildx build --platform "linux/$arch" -t "m365-risk-web:$version" -f apps/web/Dockerfile --output "type=docker,dest=release/images/web-$arch.tar" apps/web
          done
      - id: trivy-python-amd64
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with: {input: release/images/python-amd64.tar, format: sarif, output: release/python-amd64.trivy.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - id: trivy-python-arm64
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with: {input: release/images/python-arm64.tar, format: sarif, output: release/python-arm64.trivy.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - id: trivy-web-amd64
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with: {input: release/images/web-amd64.tar, format: sarif, output: release/web-amd64.trivy.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - id: trivy-web-arm64
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with: {input: release/images/web-arm64.tar, format: sarif, output: release/web-arm64.trivy.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - uses: anchore/sbom-action@v0.20.5
        with: {file: release/images/python-amd64.tar, output-file: release/python-amd64.spdx.json, format: spdx-json}
      - uses: anchore/sbom-action@v0.20.5
        with: {file: release/images/python-arm64.tar, output-file: release/python-arm64.spdx.json, format: spdx-json}
      - uses: anchore/sbom-action@v0.20.5
        with: {file: release/images/web-amd64.tar, output-file: release/web-amd64.spdx.json, format: spdx-json}
      - uses: anchore/sbom-action@v0.20.5
        with: {file: release/images/web-arm64.tar, output-file: release/web-arm64.spdx.json, format: spdx-json}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-${{ github.ref_name }}
          path: |
            release/*.spdx.json
            release/*.trivy.sarif
      - name: Enforce release image vulnerability gate
        if: always()
        env:
          PYTHON_AMD64_SCAN: ${{ steps.trivy-python-amd64.outcome }}
          PYTHON_ARM64_SCAN: ${{ steps.trivy-python-arm64.outcome }}
          WEB_AMD64_SCAN: ${{ steps.trivy-web-amd64.outcome }}
          WEB_ARM64_SCAN: ${{ steps.trivy-web-arm64.outcome }}
        run: |
          test "$PYTHON_AMD64_SCAN" = success
          test "$PYTHON_ARM64_SCAN" = success
          test "$WEB_AMD64_SCAN" = success
          test "$WEB_ARM64_SCAN" = success
      - run: mkdir -p release/artifacts/models && cp docker-compose.yml .env.example alembic.ini release/ && cp -R scripts db release/ && find release -type d -name __pycache__ -prune -exec rm -rf {} + && find release -type f -name '*.pyc' -delete && cp -R artifacts/models/current release/artifacts/models/current && echo "${GITHUB_REF_NAME#v}" > release/.release-version
      - name: Generate release checksums
        run: |
          checksum_file="$RUNNER_TEMP/m365-risk-SHA256SUMS"
          cd release
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
      - run: tar -C release -czf "../m365-risk-${GITHUB_REF_NAME}.tar.gz" .
      - uses: softprops/action-gh-release@v2
        with:
          files: m365-risk-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
