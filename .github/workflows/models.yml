name: Train and promote model

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable semantic model version (for example 1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODEL_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: Validate immutable model version
        run: |
          [[ "$MODEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Model version must use MAJOR.MINOR.PATCH format" >&2
            exit 1
          }
      - run: python -m pip install uv && uv pip sync --system requirements-dev.txt
      - run: ./scripts/download_datasets.sh
      - run: sha256sum -c data/SHA256SUMS
      - run: python scripts/generate_synthetic.py
      - run: python scripts/verify_datasets.py
      - run: python -m scripts.prepare_datasets
      - run: python -m packages.ml.m365risk_ml.train --data-root data --output artifacts/models/current --version "$MODEL_VERSION"
      - run: make notebooks PYTHON=python
      - run: python -m scripts.check_model_gate --require-approved
      - uses: actions/upload-artifact@v4
        with:
          name: approved-model-${{ inputs.version }}
          path: artifacts/models/current
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with: {name: model-reports, path: reports/generated, retention-days: 30}
      - name: Publish immutable approved model release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tag="model-$MODEL_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Model release $tag already exists and is immutable" >&2
            exit 1
          fi
          archive="approved-model-$MODEL_VERSION.tar.gz"
          checksum="approved-model-$MODEL_VERSION.sha256"
          tar -C artifacts/models/current -czf "$archive" .
          sha256sum "$archive" > "$checksum"
          gh release create "$tag" "$archive" "$checksum" --prerelease --title "Approved model $MODEL_VERSION" --notes "Immutable model bundle produced after all promotion and ONNX parity gates passed."
